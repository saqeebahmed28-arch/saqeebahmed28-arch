<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="cyanGlow" cx="15%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#238636" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="70%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#7ee787" />
      <stop offset="100%" stop-color="#56d364" />
    </linearGradient>

    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#238636" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#58a6ff" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#56d364" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#58a6ff" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .badge-text { font-size: 13px; font-weight: 600; fill: #58a6ff; letter-spacing: 2px; }
    .name-text { font-size: 48px; font-weight: 800; fill: url(#titleGradient); letter-spacing: -0.5px; }
    .sub-text { font-size: 20px; font-weight: 500; fill: #e6edf3; letter-spacing: 0.2px; }
    .desc-text { font-size: 14px; fill: #8b949e; }
    .tag-box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 6; }
    .tag-text { font-size: 12px; font-weight: 600; fill: #c9d1d9; }
  </style>

  <!-- Card Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" stroke="#30363d" stroke-width="1.2" />

  <!-- Ambient Glows -->
  <rect width="1200" height="320" rx="16" fill="url(#cyanGlow)" />
  <rect width="1200" height="320" rx="16" fill="url(#emeraldGlow)" />
  <rect width="1200" height="320" rx="16" fill="url(#purpleGlow)" />

  <!-- Grid overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Decorative Wave / Network Graph Accents (Right side) -->
  <g opacity="0.45" transform="translate(780, 40)">
    <!-- Data curve line -->
    <path d="M 0 160 Q 60 40 120 120 T 240 80 T 360 140" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="6 4" />
    <path d="M 0 180 Q 70 80 140 160 T 280 110 T 380 90" fill="none" stroke="#56d364" stroke-width="2" />
    <path d="M 30 200 Q 110 130 180 190 T 310 130 T 390 170" fill="none" stroke="#8957e5" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Graph Nodes -->
    <circle cx="60" cy="40" r="5" fill="#58a6ff" />
    <circle cx="60" cy="40" r="10" fill="none" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.5" />
    
    <circle cx="120" cy="120" r="4" fill="#7ee787" />
    <circle cx="240" cy="80" r="6" fill="#56d364" />
    <circle cx="240" cy="80" r="12" fill="none" stroke="#56d364" stroke-width="1" stroke-opacity="0.5" />

    <circle cx="280" cy="110" r="4.5" fill="#8957e5" />
    <circle cx="360" cy="140" r="5" fill="#58a6ff" />

    <!-- Connecting network lines -->
    <line x1="60" y1="40" x2="120" y2="120" stroke="#30363d" stroke-width="1" />
    <line x1="120" y1="120" x2="240" y2="80" stroke="#30363d" stroke-width="1" />
    <line x1="240" y1="80" x2="280" y2="110" stroke="#30363d" stroke-width="1" />
    <line x1="280" y1="110" x2="360" y2="140" stroke="#30363d" stroke-width="1" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(60, 48)">
    <!-- Terminal Category Pill -->
    <rect x="0" y="0" width="270" height="28" rx="14" fill="url(#badgeGradient)" stroke="#1f6feb" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#3fb950" />
    <text x="26" y="19" class="mono badge-text">DATA SCIENCE &amp; ENGINEERING</text>

    <!-- Main Title -->
    <text x="0" y="78" class="sans name-text">Saqeeb Ahamed</text>

    <!-- Subtitle / Track -->
    <text x="0" y="114" class="sans sub-text">Data Science Student &middot; Machine Learning &middot; Systems &amp; Analytics</text>

    <!-- Micro Description -->
    <text x="0" y="142" class="sans desc-text">Building predictive models, high-performance data pipelines, and intelligent algorithmic software.</text>

    <!-- Gradient Divider Line -->
    <line x1="0" y1="168" x2="680" y2="168" stroke="url(#lineGrad)" stroke-width="2" />

    <!-- Skill Tags -->
    <g transform="translate(0, 186)">
      <!-- Tag 1: Python -->
      <g transform="translate(0, 0)">
        <rect width="90" height="30" class="tag-box" />
        <text x="45" y="20" class="mono tag-text" text-anchor="middle">Python</text>
      </g>

      <!-- Tag 2: Data Science & ML -->
      <g transform="translate(100, 0)">
        <rect width="150" height="30" class="tag-box" />
        <text x="75" y="20" class="mono tag-text" text-anchor="middle">Machine Learning</text>
      </g>

      <!-- Tag 3: SQL & Warehousing -->
      <g transform="translate(260, 0)">
        <rect width="140" height="30" class="tag-box" />
        <text x="70" y="20" class="mono tag-text" text-anchor="middle">SQL &amp; Analytics</text>
      </g>

      <!-- Tag 4: DuckDB / Data Eng -->
      <g transform="translate(410, 0)">
        <rect width="150" height="30" class="tag-box" />
        <text x="75" y="20" class="mono tag-text" text-anchor="middle">Data Warehousing</text>
      </g>

      <!-- Tag 5: C / Algorithms -->
      <g transform="translate(570, 0)">
        <rect width="105" height="30" class="tag-box" />
        <text x="52" y="20" class="mono tag-text" text-anchor="middle">C &amp; DSA</text>
      </g>
    </g>
  </g>
</svg>
